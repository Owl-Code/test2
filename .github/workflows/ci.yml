name: CI - base_graph (grok_branch)

on:
  push:
    branches: [grok_branch]
  pull_request:
    branches: [grok_branch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/ scripts/ || true

      - name: Type check (pyright)
        run: |
          pip install pyright
          pyright src/base_graph || true

      - name: Run tests with coverage
        run: |
          pytest --cov=src/base_graph --cov-report=term-missing --cov-report=xml -q || true

      - name: Run validation script (if present)
        run: |
          python scripts/validate_install.py || echo "Validation script executed (or not fully present yet - expected in early SOTA phases)"

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  # Future job: simulation-harness benchmarks (Phase 3+)
