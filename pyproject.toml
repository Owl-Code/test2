[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "base_graph"
version = "3.2.1-dev"
description = "A local-first dynamic graph swarm harness implementing stigmergy, trophallaxis, cryptographic provenance, and hybrid human-AI control. Foundational layer for the full Hybrid Control Swarm Harness ecosystem (56 skills)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Owl-Code + Hybrid Control Swarm Harness Contributors", email = "paul.einwich@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
]

dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyright>=1.1.300",
    "black>=23.0.0",
    "ruff>=0.4.0"
]
dashboard = [
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "seaborn>=0.12.0"
]
full = [
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "networkx>=3.0.0",
    "hypothesis>=6.0.0"
]

[project.scripts]
base-graph-bootstrap = "base_graph.factory:create_recommended_swarm_cli"
base-graph-validate = "scripts.validate_install:main"
base-graph-dashboard = "base_graph.dashboard:serve_cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["base_graph*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "emergence: tests focused on emergence metrics and stability"
]